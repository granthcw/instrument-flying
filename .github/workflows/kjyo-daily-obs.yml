# Daily ingest of the prior UTC day: observations and baselines.
#
# NOTE: this repository is public, and GitHub auto-disables scheduled workflows
# in public repos after 60 days of inactivity. See kjyo-backtest/docs/decisions.md
# -- moving the pipeline to a private repo is the recommended fix.
name: KJYO daily observations

on:
  schedule:
    # 09:10 UTC: late enough that the prior UTC day is complete upstream.
    - cron: "10 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to ingest (YYYY-MM-DD). Defaults to yesterday."
        required: false

concurrency:
  group: kjyo-daily-obs
  cancel-in-progress: false

defaults:
  run:
    working-directory: kjyo-backtest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kjyo-backtest/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve target date
        id: target
        run: |
          D="${{ inputs.date }}"
          [ -n "$D" ] || D=$(date -u -d yesterday +%Y-%m-%d)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "Ingesting $D"

      - name: Apply migrations
        run: |
          for f in db/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Each step runs independently so one upstream outage does not block the
      # rest of the day's ingest. All writers are idempotent upserts, so a
      # failed step is fixed by re-running the workflow for that date.
      - name: METAR
        run: python -m kjyo_backtest.cli ingest-metar --date ${{ steps.target.outputs.date }}

      - name: GLM lightning
        run: python -m kjyo_backtest.cli ingest-glm --date ${{ steps.target.outputs.date }} --site KJYO --workers 24

      - name: MRMS
        if: always()
        run: python -m kjyo_backtest.cli ingest-mrms --date ${{ steps.target.outputs.date }} --site KJYO

      - name: MOS baseline
        if: always()
        run: python -m kjyo_backtest.cli ingest-mos --date ${{ steps.target.outputs.date }} --site KJYO

      - name: SPC baseline
        if: always()
        run: python -m kjyo_backtest.cli ingest-spc --date ${{ steps.target.outputs.date }} --site KJYO
