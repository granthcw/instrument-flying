# Daily health check. Stays silent unless something is wrong.
name: KJYO heartbeat

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: kjyo-backtest

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kjyo-backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: Heartbeat
        run: python -m kjyo_backtest.cli heartbeat
