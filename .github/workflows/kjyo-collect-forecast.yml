# Forecast collection: every 3 hours at :15 past, starting 00:15 UTC.
name: KJYO collect forecast

on:
  schedule:
    - cron: "15 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pull without writing"
        type: boolean
        default: false

concurrency:
  group: kjyo-collect
  cancel-in-progress: false

defaults:
  run:
    working-directory: kjyo-backtest

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TWC_API_KEY: ${{ secrets.TWC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kjyo-backtest/requirements.txt
      - run: pip install -r requirements.txt

      - name: Check the key is present
        run: |
          if [ -z "$TWC_API_KEY" ]; then
            echo "::error::TWC_API_KEY is not set. See kjyo-backtest/docs/access-notes.md."
            exit 1
          fi

      - name: Collect
        run: |
          python -m kjyo_backtest.cli collect-forecast \
            ${{ inputs.dry_run && '--dry-run' || '' }}
